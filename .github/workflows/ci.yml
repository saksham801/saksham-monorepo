name: CI

on:
    pull_request:
        paths:
            - "apps/**"
            - "packages/**"
            - "package.json"
            - "bun.lock"
            - "turbo.json"
            - "tsconfig.json"
            - "eslint.config.js"
            - ".oxlintrc.json"
            - ".oxfmtrc.json"
            - ".github/workflows/ci.yml"
    push:
        branches:
            - main
        paths:
            - "apps/**"
            - "packages/**"
            - "package.json"
            - "bun.lock"
            - "turbo.json"
            - "tsconfig.json"
            - "eslint.config.js"
            - ".oxlintrc.json"
            - ".oxfmtrc.json"
            - ".github/workflows/ci.yml"

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint, typecheck, and build
        runs-on: ubuntu-latest
        env:
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Set up Node.js for Astro formatting
              uses: actions/setup-node@v4
              with:
                  node-version: 22.22.0
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Verify workspaces
              run: bun run format:check && bunx turbo run lint typecheck build
